<!DOCTYPE html>
 
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protection Orders 2026 - The Numbers</title>
    <style>
        :root{
        color-scheme: light;
        --vizi-bg:#fff;
        --surface:#fcfcfb; 
        --plane:#f4f4f1; 
        --ink:#0b0b0b; 
        --ink-2:#52514e;
        --ink-muted:#898781; --rule:#e1e0d9; --axis:#c3c2b7;
        --accent:#2a78d6;
        --o-stopped:#2a78d6; --o-reduced:#1baf7a; --o-worse:#e34948;
        --dot-live:#2a78d6; --dot-strong:#11467f; --dot-final:#1baf7a; --dot-gone:#d8d7d0;
        --radius:10px;
        --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        }
        *{box-sizing:border-box}
        html,body{margin:0}
        body{
            background:var(--vizi-bg);
            color:var(--ink);
            font-family: Verdana, Geneva, sans-serif;
            /*font-family: 'Source Sans 3', 'Open Sans', 'Source Sans Pro', sans-serif;*/
            font-size:17px;
            line-height:1.5;
            -webkit-text-size-adjust:100%;
            padding:4px
        }
        .wrap{
            margin:0 auto
        }
        .panel{
            background:var(--surface);
            border:1px solid var(--rule);
            border-radius:var(--radius);
            padding:20px 18px;
            margin:0 0 12px
        }
        h1{font-size:1.5rem;line-height:1.18;margin:0 0 .4em;letter-spacing:-.015em}
        h2{
            font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
            color:var(--ink-muted);margin:0 0 .9em;font-weight:600}
        p{margin:0 0 .8em}
        .lede
        {
            color:var(--ink-2);
            font-size:1rem
        }
        .small{
            font-size:.82rem;
            color:var(--ink-muted);
            line-height:1.45
        }
        :focus-visible{
            outline:3px solid var(--accent);
            outline-offset:2px;
            border-radius:4px
        }

        /* --- the count --------------------------------------------------------- */
        .count{
            display:flex;
            align-items:baseline;
            gap:9px;
            flex-wrap:wrap;
            margin:12px 0 0
        }
        .count .n{
            font-size:2.5rem;
            line-height:1;
            font-weight:800;
            letter-spacing:-.035em;
            color:var(--accent);
            font-variant-numeric:tabular-nums
        }
        .count .of{                 /* same type as the step heading, in blue */
            font-size:1.25rem;
            font-weight:700;
            letter-spacing:-.01em;
            color:var(--accent);
            flex:1 1 150px;
            min-width:0;
            line-height:1.25
        }

        /* --- the grid ------------------------------------------------------------ */
        .gridwrap{
            margin:2px 0 0
        }
        svg{
            display:block;
            width:100%;
            height:auto;
            max-width:400px;
            margin:0 auto
        }
        circle{
            transition:fill .45s ease, r .45s ease, stroke .45s ease
        }
        .d-gone{
            fill:var(--dot-gone);stroke:none
        }
        .d-live{
            fill:var(--dot-live);stroke:none
        }
        .d-strong{
            fill:var(--dot-strong);stroke:none
        }
        .d-final{
            fill:var(--dot-final);stroke:none
        }
        .d-stopped{
            fill:var(--o-stopped);stroke:none
        }
        .d-reduced{
            fill:var(--o-reduced);stroke:none
        }
        .d-nochange{
            fill:none;stroke:var(--ink-muted);stroke-width:3
        }
        .d-worse{
            fill:var(--o-worse);stroke:none
        }

        /* --- legend -------------------------------------------------------------- */
        #legend[hidden]{display:none}
        #legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin:2px 0 10px;font-size:.86rem}
        .key{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
        .kd{width:14px;height:14px;border-radius:50%;flex:none}
        .kd.hollow{background:none;border:3px solid var(--ink-muted)}
        .kd.live{background:var(--dot-live)}
        .kd.strong{background:var(--dot-strong)}
        .kd.final{background:var(--dot-final)}
        .key b{color:var(--ink);font-variant-numeric:tabular-nums}

        /* --- step text ----------------------------------------------------------- */
        .step h3{font-size:1.25rem;line-height:1.25;margin:12px 0 .35em;letter-spacing:-.01em}
        .step p{color:var(--ink-2);font-size:1rem;margin:0}

        .controls{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
            margin:10px 0 0;
            border-bottom:1px solid var(--rule);
            padding-bottom:14px
        }
        
        .nav{
            font:inherit;
            font-size:.92rem;
            font-weight:600;
            cursor:pointer;
            border-radius:999px;
            padding:9px 18px;
            border:1.5px solid var(--axis);
            background:transparent;color:var(--ink)
        }

        .nav:hover:not(:disabled){
            border-color:var(--ink-2)
        }
        .nav.primary{
            background:var(--accent);
            border-color:var(--accent);
            color:#fff
        }
        .nav:disabled{
            opacity:.4;
            cursor:default
        }
        .pips{
            display:flex;
            gap:6px;
            margin-left:auto
        }
        .pip{
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--axis);
            transition:background .2s
        }
        .pip.on{
            background:var(--accent)
        }

        .toolbar{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-top:10px
        }
        
        .btn{
            font:inherit;
            font-size:.85rem;
            cursor:pointer;
            background:transparent;
            color:var(--ink-2);
            border:1px solid var(--axis);
            border-radius:999px;
            padding:6px 13px
        }
        .btn:hover{
            color:var(--ink);
            border-color:var(--ink-2)
        }
        table{
            border-collapse:collapse;
            width:100%;
            font-size:.82rem;
            margin-top:12px
        }
        th,td{
            text-align:right;
            padding:5px 6px;
            border-bottom:1px solid var(--rule);
            font-variant-numeric:tabular-nums
        }
        th:first-child,td:first-child{
            text-align:left
        }
        th{
            color:var(--ink-muted);
            font-weight:600
        }
        @media (max-width:420px){
            body{font-size:16px}
            .step h3,.count .of{font-size:1.1rem}
        }
        .sr{
            position:absolute;
            width:1px;
            height:1px;
            overflow:hidden;
            clip:rect(0 0 0 0)
        }
        
        /* Footer styles */
        .footer {
        margin-top: 30px;
        padding: 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        }

        .footer-text {
        font-size: 14px;
        color: #666;
        text-align: left;
        }

        .footer-logo {
        width: 240px;
        max-width: 100%;
        height: auto;
        }

        /* --- footer: stacked on a phone, side by side above that --------- */
        @media (max-width:560px){
            .footer{
                flex-direction:column;
                align-items:center;
                gap:14px
            }
            .footer-text{width:100%}
        }
    </style>
</head>
<body>
    <div class="wrap">

        

        <section class="panel" aria-labelledby="h-g">
            <h2 id="h-g"></h2>

            <div class="gridwrap">
                <svg id="grid" viewBox="0 0 400 400" role="img" aria-labelledby="grid-alt"></svg>
                <p class="sr" id="grid-alt"></p>
            </div>

            <div id="legend" hidden></div>

            <div class="controls">
                <button class="nav" type="button" id="back" disabled>Back</button>
                <button class="nav primary" type="button" id="next">Next</button>
                <button class="nav" type="button" id="btn-restart" disabled>Start again</button>
                <div class="pips" id="pips" aria-hidden="true"></div>
            </div>

            <div class="count">
                <span class="n" id="count"></span>
                <span class="of" id="of"></span>
            </div>

            <div class="step">
                <h3 id="head"></h3>
                <p id="body"></p>
            </div>

            <p class="sr" id="live" aria-live="polite"></p>
            
            <div class="toolbar">
                <button class="btn" type="button" id="btn-table" aria-expanded="false" hidden></button>
                
            </div>
            <div id="tablebox" hidden></div>
        </section>

      
        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                <i id="source-cite"></i>
            </div>
            <img id="footer-logo" src="" alt="" class="footer-logo" hidden>
        </div>

    </div>
     
<script>
/* ===========================================================================
   All copy and numbers live in ponumbers.json — nothing narrative is hardcoded
   below. Edit that file to change the steps, the table or the source citation.

   JSON shape:
     meta    – headings and button labels
     config  – totalDots, columns (the dot grid)
     steps[] – remaining, n, of, head, body   (HTML entities allowed)
     funnel  – rows for the "Show the numbers" table
     source  – citation text and footer logo
     See the numbers from the study
   =========================================================================== */

const DATA_URL = './ponumbers.json';

const $ = id => document.getElementById(id);

let DATA, STEPS, FUNNEL, CONFIG;
let dots = [];
let step = 0;

/* --- boot ----------------------------------------------------------------- */
fetch(DATA_URL, { cache: 'no-cache' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(init)
  .catch(err => {
    $('head').textContent = 'The numbers could not be loaded.';
    $('body').textContent =
      'ponumbers.json is missing, unreadable, or this page was opened straight '
      + 'from disk (fetch needs http://, not file://). Details: ' + err.message;
    $('next').disabled = $('back').disabled = $('btn-restart').disabled = true;
    postHeight();
  });

function init(data) {
  DATA   = data;
  STEPS  = data.steps || [];
  FUNNEL = data.funnel || [];
  CONFIG = Object.assign({ totalDots: 100, columns: 10 }, data.config || {});

  const meta = data.meta || {};
  if (meta.pageTitle)    document.title = meta.pageTitle;
  if (meta.panelHeading) $('h-g').textContent = meta.panelHeading;

  buildSource(data.source);
  buildGrid();
  buildPips();
  buildTable(meta);
  wireControls();
  render();
}

/* --- footer citation ------------------------------------------------------- */
function buildSource(src) {
  if (!src) return;
  const cite = [src.label, src.citation].filter(Boolean).join(' ');
  if (cite) $('source-cite').innerHTML = cite;

  const logo = src.logo;
  if (logo && logo.src) {
    const img = $('footer-logo');
    img.src = logo.src;
    img.alt = logo.alt || '';
    img.hidden = false;
  }
}

/* --- the dot grid ---------------------------------------------------------- */
function buildGrid() {
  const total = CONFIG.totalDots, cols = CONFIG.columns;
  const rows = Math.ceil(total / cols);
  const step_ = 40, pad = 20, r = 14;

  /* dot 0 is bottom-left: the grid fills from the bottom up, so the live
     (blue) dots sit at the bottom and the grey ones fall away at the top. */
  let svg = '';
  for (let i = 0; i < total; i++) {
    const cx = pad + (i % cols) * step_;
    const cy = pad + (rows - 1 - Math.floor(i / cols)) * step_;
    svg += `<circle id="d${i}" cx="${cx}" cy="${cy}" r="${r}" class="d-live"/>`;
  }
  const grid = $('grid');
  grid.setAttribute('viewBox', `0 0 ${cols * step_} ${rows * step_}`);
  grid.innerHTML = svg;

  dots = [];
  for (let i = 0; i < total; i++) dots.push($('d' + i));
}

function buildPips() {
  $('pips').innerHTML =
    STEPS.map((_, i) => `<span class="pip" data-pip="${i}"></span>`).join('');
}

/* --- the numbers table ----------------------------------------------------- */
function buildTable(meta) {
  if (!FUNNEL.length) return;
  const cols = meta.tableColumns || ['Stage', 'Women', 'Dots'];

  $('tablebox').innerHTML =
    `<table><caption class="sr">${meta.tableCaption || ''}</caption><thead><tr>`
    + cols.map(c => `<th scope="col">${c}</th>`).join('')
    + '</tr></thead><tbody>'
    + FUNNEL.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('')
    + '</tbody></table>';

  const btn = $('btn-table');
  btn.textContent = meta.tableButtonShow || 'Show the numbers';
  btn.hidden = false;
}

/* --- render ---------------------------------------------------------------- */
function render() {
  const s = STEPS[step];
  if (!s) return;

  const bands = bandsFor(s);
  for (let i = 0; i < dots.length; i++) {
    const band = bands.find(b => i < b.upTo);
    const cls  = band ? band.class : 'd-gone';
    dots[i].setAttribute('class', cls);
    dots[i].setAttribute('r', cls === 'd-gone' ? 7 : 14);
  }
  buildLegend(s.legend);

  $('count').textContent = s.n;
  $('of').innerHTML = s.of;
  $('head').innerHTML = s.head;
  $('body').innerHTML = s.body;
  $('grid-alt').textContent = s.head + '. ' + s.n + ' ' + stripTags(s.of) + '.';
  $('live').textContent = s.head + '. ' + s.n + '.';

  $('back').disabled = step === 0;
  $('btn-restart').disabled = step === 0;
  $('next').disabled = step === STEPS.length - 1;
  $('next').textContent = step === STEPS.length - 2 ? 'Finish' : 'Next';
  [...$('pips').children].forEach((p, i) => p.classList.toggle('on', i <= step));
  postHeight();
}

/* How a step colours its dots, innermost group first.
   - `bands`  : [{ upTo, class }, ...] in ascending order — full control,
                used by the last step to show three groups at once.
   - `held`   : shorthand for two groups — `remaining` deep, the rest up to
                `held` still blue, so a sub-group can advance without the
                others falling away.
   - neither  : `remaining` blue, the rest grey. The original behaviour. */
function bandsFor(s) {
  if (Array.isArray(s.bands) && s.bands.length) return s.bands;
  const held = Math.max(s.held || 0, s.remaining);
  return held > s.remaining
    ? [{ upTo: s.remaining, class: 'd-strong' }, { upTo: held, class: 'd-live' }]
    : [{ upTo: s.remaining, class: 'd-live' }];
}

function buildLegend(keys) {
  const box = $('legend');
  if (!keys || !keys.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = keys.map(k => {
    const swatch = k.class === 'd-strong' ? 'strong'
                 : k.class === 'd-final'  ? 'final'
                 : k.class === 'd-gone'   ? 'gone' : 'live';
    return `<span class="key"><span class="kd ${swatch}"></span>`
         + (k.n ? `<b>${k.n}</b> ` : '') + (k.label || '') + '</span>';
  }).join('');
  box.hidden = false;
}

const stripTags = html => {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent;
};

function go(d) {
  const n = step + d;
  if (n < 0 || n >= STEPS.length) return;
  step = n; render();
}

/* --- controls -------------------------------------------------------------- */
function wireControls() {
  $('next').addEventListener('click', () => go(1));
  $('back').addEventListener('click', () => go(-1));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });
  $('btn-restart').addEventListener('click', () => {
    step = 0; render();
    const top = document.querySelector('h1, h2');
    if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('btn-table').addEventListener('click', e => {
    const open = $('tablebox').hidden;
    const meta = (DATA && DATA.meta) || {};
    $('tablebox').hidden = !open;
    e.target.setAttribute('aria-expanded', String(open));
    e.target.textContent = open
      ? (meta.tableButtonHide || 'Hide the numbers from the study')
      : (meta.tableButtonShow || 'See the numbers from the study');
    postHeight();
  });
}

/* iframe auto-height, same contract as the other Bhekisisa interactives */
function postHeight() {
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  parent.postMessage({ bhekisisaEmbed: 'height', height: h, id: location.pathname }, '*');
}
new ResizeObserver(postHeight).observe(document.documentElement);
addEventListener('load', postHeight);
[300, 1000, 2500, 6000].forEach(t => setTimeout(postHeight, t));
</script>
</body>
</html>
