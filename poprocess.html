<!DOCTYPE html>
 
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protection Orders 2026 - The Process</title>
    <style>
     
        :root{
        color-scheme: light;
        --bg:#ffffff;
        --surface:#fcfcfb; --plane:#f4f4f1; --ink:#0b0b0b; --ink-2:#52514e;
        --ink-muted:#898781; --rule:#e1e0d9; --axis:#c3c2b7;
        --accent:#2a78d6;      /* the law / interactive          */
        --flag:#d03b3b;        /* myths, quick exit              */
        --radius:10px;
        --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        
        }

        *{box-sizing:border-box}
        html,body{margin:0}
        body{
            background:var(--bg);
            color:var(--ink);
            /* font-family:var(--font);*/
            font-family: 'Source Sans 3', 'Open Sans', 'Source Sans Pro', sans-serif;
            font-size:17px;
            line-height:1.5;
            -webkit-text-size-adjust:100%;
            padding:4px
            }

        /* .wrap{max-width:660px;margin:0 auto} */
        .wrap{margin:0 auto}

        .panel{background:var(--surface);
            border:1px solid var(--rule);
            border-radius:var(--radius);
            padding:20px 18px;
            margin:0 0 12px}

        h1{font-size:1.45rem;line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
        h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
        color:var(--ink-muted);margin:0 0 .9em;font-weight:600}
        p{margin:0 0 .8em}
        .lede{color:var(--ink-2);font-size:1rem}
        .small{font-size:.82rem;color:var(--ink-muted);line-height:1.45}
        :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

        /* --- safety bar ---------------------------------------------------------- */
        .safety{display:flex;gap:10px;align-items:center;justify-content:space-between;
        flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);
        border-radius:var(--radius);padding:9px 12px;margin:0 0 12px}
        .exit{font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--flag);
        color:#fff;border:0;border-radius:999px;padding:8px 15px}
        .helpline{font-size:.84rem;color:var(--ink-2)}
        .helpline b{color:var(--ink);white-space:nowrap}

        /* --- stage grid ---------------------------------------------------------
        Eight square cards: four across on a wide screen (two rows of four), two
        across on a phone (four rows of two). Fixed column counts rather than
        auto-fit, because eight items at three columns leaves a ragged last row. */
        .rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
        .chip{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
        aspect-ratio:1/1;text-align:center;cursor:pointer;font:inherit;
        background:transparent;color:var(--ink);border:1.5px solid var(--axis);
        border-radius:10px;padding:11px 7px 9px;
        transition:background .12s,border-color .12s}
        .chip:hover{border-color:var(--ink-2)}
        .chip[aria-current="step"]{border-color:var(--accent);
        background:color-mix(in srgb,var(--accent) 10%,transparent)}
        .chip .num{font-size:.66rem;font-weight:700;letter-spacing:.08em;color:var(--ink-muted);
        line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
        .chip .t{font-size:.83rem;font-weight:600;line-height:1.18;hyphens:auto}
        .chip[aria-current="step"] .t{color:var(--accent)}
        .chip[aria-current="step"] .num{color:var(--accent)}
        /* The icon takes every pixel the number and the label leave behind: .ic
        is the leftover space, and the SVG fills it. Each icon carries its own
        viewBox (they were drawn on 32, 64 and 512 grids), and the default
        preserveAspectRatio scales each one to fit this square box without
        distorting it, so no cap and no per-icon sizing is needed. */
        .chip .ic{flex:1;min-height:0;width:100%;padding-top:4px}
        .chip svg{display:block;width:100%;height:100%}
        /* The icons carry their own fills, so there is nothing to colour here:
        each one is dropped in exactly as it was drawn. The current stage is
        marked by the card's border and tint, so the icons stay identical
        throughout and the eye goes to the card, not the artwork. */
        @media (max-width:560px){
        .rail{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
        .chip .t{font-size:.92rem}
        }
        @media (max-width:330px){.rail{grid-template-columns:1fr}.chip{aspect-ratio:auto}}

        /* --- stage body ---------------------------------------------------------- */
        .stagehead{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
        .stagenum{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--ink-muted);
        text-transform:uppercase;white-space:nowrap}
        /* the same marker, riding on the panel heading */
        h2 .stagenum{color:var(--accent)}
        h3{font-size:1.25rem;line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
        .where{font-size:.8rem;color:var(--ink-muted);margin:0 0 1em;
        border-bottom:1px solid var(--rule);padding-bottom:.8em}
        /* The action line: one sentence on what needs to happen, sitting between
        the heading and the "Where". With the law folded away by default this is
        what a reader sees first, so it has to stand on its own. */
        .action{font-size:1.02rem;color:var(--ink-2);line-height:1.4;margin:0 0 .6em}

        /* Both the law and the myths are native <details>: keyboard accessible,
        and still readable if the script fails. Neither carries the open
        attribute, and render() rebuilds the stage each time, so both start
        closed on every stage. */
        summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
        padding:5px 0;border-radius:4px}
        summary::-webkit-details-marker{display:none}
        summary:hover .sumtext{color:var(--ink)}
        .chev{flex:none;width:17px;height:17px;stroke:var(--ink-muted);fill:none;
        stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
        details[open] > summary .chev{transform:rotate(180deg)}

        /* --- what should happen -------------------------------------------------- */
        .lawwrap{border:1px solid var(--rule);border-left:4px solid var(--accent);
        border-radius:8px;padding:2px 14px;margin:0 0 10px}
        .lawwrap > summary{padding:10px 0}
        .lawwrap .sumtext{flex:1;font-size:.92rem;font-weight:600;color:var(--accent)}
        .lawwrap .body{padding:0 0 10px}
        .lawwrap p{margin:0 0 .6em;font-size:.97rem}
        .lawwrap p:last-child{margin:0}

        /* --- branch cards -------------------------------------------------------- */
        .branches{display:grid;gap:8px;margin:.2em 0 .6em}
        .branch{border:1px solid var(--rule);border-radius:8px;padding:11px 13px}
        .branch b{display:block;font-size:.9rem;margin-bottom:.2em}
        .branch span{font-size:.88rem;color:var(--ink-2)}

        /* --- myths --------------------------------------------------------------- */
        .mythwrap{border:1px solid var(--rule);border-left:4px solid var(--flag);
        border-radius:8px;padding:2px 14px;margin:0 0 12px}
        .mythwrap > summary{padding:10px 0}
        .mythwrap .sumtext{flex:1;font-size:.92rem;font-weight:600;color:var(--flag)}
        .mythwrap .body{padding:0 0 10px}
        .myth{border-top:1px solid var(--rule);padding:11px 0 0;margin:0 0 11px}
        .myth:last-child{margin:0}
        .myth .claim{font-style:italic;color:var(--ink-2);margin:0 0 .35em;font-size:.95rem}
        .myth .truth{margin:0;font-size:.93rem}
        .myth .truth b{color:var(--flag);text-transform:uppercase;font-size:.72rem;
        letter-spacing:.05em;margin-right:.4em;font-weight:700}


        /* --- controls (Back / Next / Start again + pips) -------------------------
        Lifted from ponumbers.html so the two interactives steer identically: the
        rail is still there for jumping about, these move one stage at a time. */
        .controls{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
            margin:10px 0 0;
            border-bottom:1px solid var(--rule);
            padding-bottom:14px
        }
        .nav{
            font:inherit;
            font-size:.92rem;
            font-weight:600;
            cursor:pointer;
            border-radius:999px;
            padding:9px 18px;
            border:1.5px solid var(--axis);
            background:transparent;color:var(--ink)
        }
        .nav:hover:not(:disabled){
            border-color:var(--ink-2)
        }
        .nav.primary{
            background:var(--accent);
            border-color:var(--accent);
            color:#fff
        }
        .nav:disabled{
            opacity:.4;
            cursor:default
        }
        .pips{
            display:flex;
            gap:6px;
            margin-left:auto
        }
        .pip{
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--axis);
            transition:background .2s
        }
        .pip.on{
            background:var(--accent)
        }

        @media (prefers-reduced-motion:reduce){.pip{transition:none}}

        @media (prefers-reduced-motion:reduce){.chev{transition:none}}
        .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
        @media (max-width:420px){
        body{font-size:16px}
        h3{font-size:1.1rem}
        }
        /* Footer styles */
        .footer {
        margin-top: 30px;
        padding: 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        }

        .footer-text {
        font-size: 14px;
        color: #666;
        text-align: left;
        }

        .footer-logo {
        width: 240px;
        }
</style>
</head>
<body>
    <div class="wrap">

        <section class="panel" aria-labelledby="h-w">
            <h2 id="h-w">How to obtain a protection order</h2>

            <div class="rail" id="rail" role="tablist" aria-label="Stages"></div>

            <div class="controls">
                <button class="nav" type="button" id="back" disabled>Back</button>
                <button class="nav primary" type="button" id="next">Next</button>
                <button class="nav" type="button" id="btn-restart" disabled>Start again</button>
                <div class="pips" id="pips" aria-hidden="true"></div>
            </div>

            <div id="stage"></div>
            <p class="sr" id="live" aria-live="polite"></p>
        </section>
        
           
        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                <i id="source-cite"></i>
            </div>
            <img id="footer-logo" src="" alt="" class="footer-logo" hidden>
        </div>

    </div>


</body>

<script>
/* ===========================================================================
   DATA — where the two JSON files live. Relative to this page; absolute URLs
   work too, as long as they are same-origin or CORS-enabled.
   =========================================================================== */
const DATA = {
  stages: 'poprocess.json',
  icons:  'poicons.json'
};

const $ = id => document.getElementById(id);
const num = n => n.toLocaleString('en-ZA').replace(/[, ]/g, ' ');

/* Filled in by load(); see po-stages.json and po-icons.json for the shapes. */
let STAGES = [], SOURCE = '', ICONS = {};
/* The panel heading as authored; render() re-prints it with the stage count. */
const HEADING = $('h-w').textContent.trim();
const FALLBACK_VIEWBOX = '0 0 64 64';
let i = 0;

/* ---------------------------------------------------------------------------
   Read the icons out of poicons.json. Each entry is the inside of one SVG plus
   the viewBox it was drawn on, so an icon can come from any grid; keys starting
   with an underscore are notes to the reader and are skipped.
   --------------------------------------------------------------------------- */
function buildIcons(spec) {
  const fallback = spec.defaultViewBox || FALLBACK_VIEWBOX;
  const out = {};
  for (const [name, ic] of Object.entries(spec.icons || {})) {
    if (name.startsWith('_')) continue;
    out[name] = {
      viewBox: ic.viewBox || fallback,
      svg: ic.svg || ''
    };
  }
  return out;
}

/* --- footer citation ------------------------------------------------------- */
function buildSource(src) {
  if (!src) return;
  const cite = [src.label, src.citation].filter(Boolean).join(' ');
  if (cite) $('source-cite').innerHTML = cite;

  const logo = src.logo;
  if (logo && logo.src) {
    const img = $('footer-logo');
    img.src = logo.src;
    img.alt = logo.alt || '';
    img.hidden = false;
  }
}

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${url} — ${r.status} ${r.statusText}`);
  return r.json();
}

async function load() {
  try {
    const [stageFile, iconFile] = await Promise.all([
      getJSON(DATA.stages), getJSON(DATA.icons)
    ]);
    STAGES = stageFile.stages || [];
    SOURCE = stageFile.source || '';
    ICONS  = buildIcons(iconFile);
    if (!STAGES.length) throw new Error(`${DATA.stages} — no stages in the file`);
  } catch (err) {
    /* Nothing to show, so say so plainly and keep the helpline on screen. */
    $('stage').innerHTML = `<p class="where" style="border:0">This walkthrough
      could not load its content. If you need help now, the GBV Command Centre
      is on <b>0800 428 428</b>, free, 24 hours.</p>
      <p class="small">${String(err.message || err)}</p>`;
    $('next').disabled = $('back').disabled = $('btn-restart').disabled = true;
    postHeight();
    return;
  }
  buildRail();
  buildPips();
  wireControls();
  buildSource(SOURCE);
  /* $('src').innerHTML = SOURCE;*/
  render();
}

function buildRail() {
  $('rail').innerHTML = STAGES.map((s, n) => {
    /* An unknown or missing icon leaves an empty square rather than a broken
       card, so a typo in poprocess.json costs a picture and not the page. */
    const ic = ICONS[s.icon] || { viewBox: FALLBACK_VIEWBOX, svg: '' };
    return `<button class="chip" type="button" role="tab" data-go="${n}"
             aria-label="Stage ${n + 1}: ${s.short}">
       <span class="num">${n + 1}</span>
       <span class="t">${s.short}</span>
       <span class="ic"><svg viewBox="${ic.viewBox}" aria-hidden="true"
              focusable="false">${ic.svg}</svg></span>
     </button>`;
  }).join('');
}

/* One dot per stage, filled in up to the stage being read. */
function buildPips() {
  $('pips').innerHTML =
    STAGES.map((_, n) => `<span class="pip" data-pip="${n}"></span>`).join('');
}

function render() {
  const s = STAGES[i];
  const parts = [];
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const sum = (inner) => `<summary>${inner}${CHEV}</summary>`;

  $('h-w').innerHTML =
    `${HEADING} &mdash; <span class="stagenum">Stage ${i + 1} of ${STAGES.length}</span>`;

  parts.push(`<br/><h3>${s.title}</h3>`);
  /* What needs to happen, in one line, before anything has to be opened. */
  if (s.action) parts.push(`<p class="action">What to do: ${s.action}</p>`);
  parts.push(`<p class="where">Where: ${s.where}</p>`);

  /* The law, folded away: the action line above carries the gist, and this is
     the detail for a reader who wants it. Closed on every stage, every time. */
  const branches = s.branches ? `<div class="branches">${s.branches.map(b =>
    `<div class="branch"><b>${b.t}</b><span>${b.b}</span></div>`).join('')}</div>` : '';
  if (s.law) parts.push(`<details class="lawwrap">
    ${sum('<span class="sumtext">What should happen</span>')}
    <div class="body">${s.law.map(p => `<p>${p}</p>`).join('')}${branches}</div></details>`);

  /* The myths stay folded away, so the stage reads as the law first. */
  if (s.myths) parts.push(`<details class="mythwrap">
    ${sum(`<span class="sumtext">${s.myths.length} ${s.myths.length === 1 ? 'thing' : 'things'}
      you may be told that ${s.myths.length === 1 ? 'is' : 'are'} not true</span>`)}
    <div class="body">${s.myths.map(m =>
      `<div class="myth"><p class="claim">${m.claim}</p>
       <p class="truth"><b>Not true</b>${m.truth}</p></div>`).join('')}</div></details>`);

  $('stage').innerHTML = parts.join('');
  /* 'toggle' does not bubble, so each panel gets its own listener; the iframe
     has to be told its new height every time one opens or closes. */
  $('stage').querySelectorAll('details').forEach(d => d.addEventListener('toggle', postHeight));
  $('live').textContent = `Stage ${i + 1}: ${s.title}`;

  [...$('rail').children].forEach((c, n) => {
    if (n === i) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current');
  });

  /* Back and Start again are dead on stage one; Next is dead on the last. The
     label walks Start -> Next -> Finish, so an untouched walkthrough invites a
     first click rather than looking like it is already part-read. */
  $('back').disabled = i === 0;
  $('btn-restart').disabled = i === 0;
  $('next').disabled = i === STAGES.length - 1;
  $('next').textContent =
      i === 0 ? 'Start'
    : i === STAGES.length - 2 ? 'Finish'
    : 'Next';
  [...$('pips').children].forEach((p, n) => p.classList.toggle('on', n <= i));

  postHeight();
}

function go(n) {
  if (n < 0 || n >= STAGES.length) return;
  i = n; render();
  $('stage').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* Relative move, so Back and Next need no knowledge of where they are. */
const step = d => go(i + d);

function wireControls() {
  $('next').addEventListener('click', () => step(1));
  $('back').addEventListener('click', () => step(-1));
  $('btn-restart').addEventListener('click', () => {
    i = 0; render();
    const top = document.querySelector('h1, h2');
    if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

$('rail').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft') go(i - 1);
});

document.querySelectorAll('[data-exit]').forEach(b => b.addEventListener('click', () => {
  const away = 'https://www.google.com';
  try { if (window.top !== window.self) window.top.location.replace(away); } catch (err) {}
  location.replace(away);
}));

function postHeight() {
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  parent.postMessage({ bhekisisaEmbed: 'height', height: h, id: location.pathname }, '*');
}
new ResizeObserver(postHeight).observe(document.documentElement);
addEventListener('load', postHeight);
load();
</script>
